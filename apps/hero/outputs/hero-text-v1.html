<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <title>My Hero Page</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">

    .hero {
      @apply flex flex-col justify-center px-6 py-16 sm:px-10 md:px-16;
    }

    .hero-light {
      @apply bg-slate-50;
    }

    .hero-dark {
      @apply bg-slate-900;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    .hero-content {
      @apply w-full max-w-5xl;
    }

    .hero h1 {
      @apply max-w-4xl text-4xl font-bold leading-tight tracking-tight text-slate-900 sm:text-5xl md:text-6xl;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply mt-6 max-w-3xl text-lg leading-relaxed text-slate-700 sm:text-xl md:text-2xl;
      overflow-wrap: anywhere;
    }

    .hero-dark h1 {
      @apply text-slate-50;
    }

    .hero-dark h2 {
      @apply text-slate-300;
    }

    .hero-centre {
      @apply text-center;
    }

    .hero-centre .hero-content {
      @apply mx-auto;
    }
      
  </style>
</head>
<body>

  <header class="hero hero-dark">
    <div class="hero-content">
      <h1>Design your next adventure.</h1>
      <h2>Create a hero block with your own text and styles.</h2>
    </div>
  </header>

</body>
</html>
